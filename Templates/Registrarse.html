<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Mismo fondo oscurecido */
      background: 
        linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
        url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      padding: 30px 20px;
    }

    /* Contenedor que agrupa ambas tarjetas */
    .registration-wrapper {
      display: flex;
      gap: 24px;
      max-width: 1050px;
      width: 100%;
      align-items: stretch;
    }

    /* Tarjetas blancas con efecto 3D sin bordes */
    .card {
      background-color: #ffffff;
      border-radius: 28px;
      border: none;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.35),
        0 10px 15px rgba(0, 0, 0, 0.15);
      padding: 35px;
    }

    /* Tarjeta principal (formulario) */
    .main-card {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tarjeta lateral informativa */
    .side-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      text-align: center;
      min-width: 280px;
    }

    /* Contenedores de Logo y Sublogo */
    .logo-container {
      width: 100px;
      height: 100px;
      margin: 0 auto 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .sublogo-container {
      width: 220px;
      margin: 0 auto 25px;
    }

    .sublogo-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Formulario en 2 columnas */
    .form-container {
      width: 100%;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 25px;
      row-gap: 16px;
      width: 100%;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #333333;
      margin-bottom: 6px;
      margin-left: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid #2e7d32;
      outline: none;
      font-size: 0.9rem;
      color: #333333;
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #1b5e20;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
    }

    /* Campo compuesto de teléfono (+56 y número) */
    .phone-input-group {
      display: flex;
      gap: 8px;
    }

    .phone-prefix {
      width: 75px !important;
      text-align: center;
      background-color: #f7f7f7 !important;
      font-weight: 600;
    }

    /* Botón Registrarse */
    .btn-submit-container {
      display: flex;
      align-items: flex-end;
    }

    .btn-register {
      width: 100%;
      padding: 11px 0;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(135deg, #43a047, #2e7d32);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.25);
      transition: all 0.2s ease;
    }

    .btn-register:hover {
      background: linear-gradient(135deg, #388e3c, #1b5e20);
      transform: translateY(-1px);
    }

    /* Estilos del panel lateral */
    .side-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #333333;
      margin-bottom: 20px;
    }

    .text-box {
      border: 1.5px solid #cccccc;
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      font-size: 0.85rem;
      color: #555555;
      line-height: 1.5;
      background-color: #fafafa;
      min-height: 200px;
    }

    /* Adaptabilidad a pantallas pequeñas */
    @media (max-width: 860px) {
      .registration-wrapper {
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .side-card {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="registration-wrapper">

    <!-- Tarjeta Principal: Formulario -->
    <div class="card main-card">
      <!-- Isotipo / Logo circular -->
      <div class="logo-container">
        <img src="tu-logo-isotipo.png" alt="Logo">
      </div>

      <!-- Sublogo / Texto rectangular -->
      <div class="sublogo-container">
        <img src="tu-sublogo-texto.png" alt="Biotechnica">
      </div>

      <form class="form-container" onsubmit="event.preventDefault();">
        <div class="form-grid">
          
          <!-- Fila 1 -->
          <div class="form-group">
            <label for="run">RUN</label>
            <input type="text" id="run" name="run" placeholder="12.345.678-9" required>
          </div>
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Primer nombre" required>
          </div>

          <!-- Fila 2 -->
          <div class="form-group">
            <label for="tercer-nombre">Tercer Nombre</label>
            <input type="text" id="tercer-nombre" name="tercer-nombre" placeholder="Opcional">
          </div>
          <div class="form-group">
            <label for="segundo-nombre">Segundo Nombre</label>
            <input type="text" id="segundo-nombre" name="segundo-nombre" placeholder="Opcional">
          </div>

          <!-- Fila 3 -->
          <div class="form-group">
            <label for="apellido-paterno">Apellido Paterno</label>
            <input type="text" id="apellido-paterno" name="apellido-paterno" placeholder="Apellido paterno" required>
          </div>
          <div class="form-group">
            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
          </div>

          <!-- Fila 4 -->
          <div class="form-group">
            <label for="apellido-materno">Apellido Materno</label>
            <input type="text" id="apellido-materno" name="apellido-materno" placeholder="Apellido materno">
          </div>
          <div class="form-group">
            <label for="telefono">Numero Personal de Contacto</label>
            <div class="phone-input-group">
              <input type="text" class="phone-prefix" value="+56" readonly>
              <input type="tel" id="telefono" name="telefono" placeholder="9 1234 5678" required>
            </div>
          </div>

          <!-- Fila 5 -->
          <div class="form-group">
            <label for="correo">Correo Personal de Contacto</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
          </div>
          <div class="btn-submit-container">
            <button type="submit" class="btn-register">Registrarse</button>
          </div>

        </div>
      </form>
    </div>

    <!-- Tarjeta Secundaria: Panel de Información -->
    <div class="card side-card">
      <h2 class="side-title">Titulo Texto</h2>
      <div class="text-box">
        <p>Cuadro para texto</p>
      </div>
    </div>

  </div>

</body>
</html>
