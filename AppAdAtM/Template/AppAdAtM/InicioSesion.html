<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* El gradiente rgba(0,0,0,0.75) oscurece la imagen de fondo */
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            color: #ffffff;
        }

        /* Barra superior */
        .header-bar {
            width: 100%;
            padding: 10px 0;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Contenedor para centrar la tarjeta */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Tarjeta principal de Inicio de Sesión */
        .login-card {
            width: 100%;
            max-width: 360px;
            background: rgba(18, 18, 20, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 35px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* Círculo para el Logo */
        .logo-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-bottom: 15px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Recuadro de Sublogo */
        .sublogo-box {
            width: 100%;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 2px;
            padding: 6px;
            font-size: 0.9rem;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Slogan */
        .slogan {
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        /* Formulario e entradas de texto */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
        }

        /* Fila de botones */
        .buttons-row {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }

        .btn {
            flex: 1;
            padding: 8px 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Enlace inferior */
        .forgot-password {
            margin-top: 15px;
            color: #ffffff;
            text-decoration: underline;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>



    <main class="main-container">
        <div class="login-card">
            <h1 class="title">BIENVENIDO</h1>
            
            <div class="logo-circle">
                <!-- Reemplazar el <span> por <img src="tu_logo.png"> cuando tengas el archivo -->
                <span>Logo</span>
            </div>

            <div class="sublogo-box">
                Sublogo
            </div>

            <p class="slogan">SLOGAN</p>

            <form class="login-form">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="buttons-row">
                    <button type="submit" class="btn">Acceder</button>
                    <button type="button" class="btn">Registrarse</button>
                </div>
            </form>

            <a href="#" class="forgot-password">Olvidaste Tu Contraseña?</a>
        </div>
    </main>

</body>
</html>
