{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión</title>
   <script src="{% static 'AppAdAtM/js/Filtros.js' %}"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Fondo con imagen y capa oscurecida superpuesta */
      background: 
        linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
        url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      padding: 20px;
    }

    /* Tarjeta blanca con efecto 3D (sombra flotante sin bordes) */
    .login-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 35px 30px;
      border-radius: 28px;
      border: none;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.35),
        0 10px 15px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .welcome-text {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #333333;
      margin-bottom: 18px;
    }

    /* Contenedor del isotipo circular */
    .logo-container {
      width: 115px;
      height: 115px;
      margin: 0 auto 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Contenedor del nombre/sublogo */
    .sublogo-container {
      width: 80%;
      max-width: 250px;
      margin: 0 auto 10px;
    }

    .sublogo-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .slogan {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #666666;
      margin-bottom: 24px;
    }

    /* Formulario e inputs */
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #333333;
      margin-bottom: 6px;
      margin-left: 4px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #2e7d32;
      outline: none;
      font-size: 0.95rem;
      color: #333333;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #1b5e20;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
    }

    /* Fila de botones */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      margin-bottom: 18px;
    }

    .btn {
      flex: 1;
      padding: 10px 0;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #43a047, #2e7d32);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.25);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #388e3c, #1b5e20);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #f5f5f5;
      color: #333333;
      border: 1.5px solid #cccccc;
    }

    .btn-secondary:hover {
      background-color: #e8e8e8;
      border-color: #b0b0b0;
      transform: translateY(-1px);
    }

    /* Enlace de recuperación */
    .forgot-link {
      display: inline-block;
      font-size: 0.8rem;
      color: #555555;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #2e7d32;
      text-decoration: underline;
    }
  </style>
  <link rel="stylesheet" href="{% static 'AppAdAtM/css/Common.css' %}">
</head>
<body>

  <div class="login-card">
    <div class="welcome-text">BIENVENIDO</div>

    <!-- Círculo / Isotipo superior del logo -->
    <div class="logo-container">
      <img src="{% static 'AppAdAtM/Imagenes/tu-logo-isotipo.png' %}" alt="Logo Biothecnica">
    </div>

    <!-- Caja inferior / Nombre de marca del logo -->
    <div class="sublogo-container">
      <img src="{% static 'AppAdAtM/Imagenes/tu-sublogo-texto.png' %}" alt="Biotechnica">
    </div>

    <div class="slogan">GLOBAL PHARMA</div>
{% if messages %}
  {% for message in messages %}
    <div class="alert-msg {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}
    
    <form method="POST" action="">
      {% csrf_token %}

      {% if error %}
        <div style="background:#ffebee; color:#c62828; padding:10px; border-radius:8px; margin-bottom:15px; font-size:0.85rem;">
          {{ error }}
        </div>
      {% endif %}

      <div class="form-group">
        <label for="modo">Iniciar sesión con</label>
        <select id="modo" name="modo">
          <option value="run">RUN</option>
          <option value="correo">Correo electrónico</option>
        </select>
      </div>

      <div class="form-group">
        <label for="identificador" id="etiqueta-identificador">RUN</label>
        <input type="text" id="identificador" name="identificador" placeholder="12.345.678-5"
          autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••"
          autocomplete="current-password" required>
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">Acceder</button>
        <a class="btn btn-secondary" href="{% url 'registrarse_usuario' %}" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">Registrarse</a>
      </div>

      <a href="{% url 'solicitar_restauracion_contrasena' %}" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </form>
  </div>

  <script>
    const modo = document.getElementById('modo');
    const identificador = document.getElementById('identificador');
    const etiquetaIdentificador = document.getElementById('etiqueta-identificador');

    function actualizarModoIdentificacion() {
      const usaCorreo = modo.value === 'correo';
      identificador.type = usaCorreo ? 'email' : 'text';
      identificador.placeholder = usaCorreo ? 'nombre@ejemplo.com' : '12.345.678-5';
      identificador.autocomplete = 'username';
      etiquetaIdentificador.textContent = usaCorreo ? 'Correo electrónico' : 'RUN';
    }

    modo.addEventListener('change', actualizarModoIdentificacion);
    actualizarModoIdentificacion();
  </script>
</body>
</html>
