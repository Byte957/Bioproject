{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión</title>
  <link rel="stylesheet" href="{% static 'AppAdAtM/css/estilos.css' %}">
</head>
<body>

  <div class="login-card">
    <div class="welcome-text">BIENVENIDO</div>

    <!-- Círculo / Isotipo superior del logo -->
    <div class="logo-container">
      <img src="tu-logo-isotipo.png" alt="Logo Biothecnica">
    </div>

    <!-- Caja inferior / Nombre de marca del logo -->
    <div class="sublogo-container">
      <img src="tu-sublogo-texto.png" alt="Biotechnica">
    </div>

    <div class="slogan">SLOGAN DE LA EMPRESA</div>

    <form onsubmit="event.preventDefault();">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">Acceder</button>
        <button type="button" class="btn btn-secondary">Registrarse</button>
      </div>

      <a href="#" class="forgot-link">¿Olvidaste Tu Contraseña?</a>
    </form>
  </div>

</body>
</html>
