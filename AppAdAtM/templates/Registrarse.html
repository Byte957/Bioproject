{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <script src="{% static 'AppAdAtM/js/Filtros.js' %}"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: 
        linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
        url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      padding: 30px 20px;
    }

    .registration-wrapper {
      display: flex;
      gap: 24px;
      max-width: 1050px;
      width: 100%;
      align-items: stretch;
    }

    .card {
      background-color: #ffffff;
      border-radius: 28px;
      border: none;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.35),
        0 10px 15px rgba(0, 0, 0, 0.15);
      padding: 35px;
    }

    .main-card {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .side-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      text-align: center;
      min-width: 280px;
    }

    .logo-container {
      width: 100px;
      height: 100px;
      margin: 0 auto 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .sublogo-container {
      width: 220px;
      margin: 0 auto 25px;
    }

    .sublogo-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .form-container {
      width: 100%;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 25px;
      row-gap: 16px;
      width: 100%;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #333333;
      margin-bottom: 6px;
      margin-left: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid #2e7d32;
      outline: none;
      font-size: 0.9rem;
      color: #333333;
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #1b5e20;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
    }

    .phone-input-group {
      display: flex;
      gap: 8px;
    }

    .phone-prefix {
      width: 75px !important;
      text-align: center;
      background-color: #f7f7f7 !important;
      font-weight: 600;
    }

    .btn-submit-container {
      display: flex;
      align-items: flex-end;
      grid-column: span 2;
      margin-top: 8px;
    }

    .btn-register {
      width: 100%;
      padding: 11px 0;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(135deg, #43a047, #2e7d32);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.25);
      transition: all 0.2s ease;
    }

    .btn-register:hover {
      background: linear-gradient(135deg, #388e3c, #1b5e20);
      transform: translateY(-1px);
    }

    .side-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #333333;
      margin-bottom: 20px;
    }

    .text-box {
      border: 1.5px solid #cccccc;
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      font-size: 0.85rem;
      color: #555555;
      line-height: 1.5;
      background-color: #fafafa;
      min-height: 200px;
    }

    .alert-msg {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }

    .alert-error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .alert-success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    @media (max-width: 860px) {
      .registration-wrapper {
        flex-direction: column;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .btn-submit-container {
        grid-column: span 1;
      }
      .side-card {
        min-width: 100%;
      }
    }
  </style>
  <link rel="stylesheet" href="{% static 'AppAdAtM/css/Common.css' %}">
</head>
<body>

  <div class="registration-wrapper">

    <div class="card main-card">
      <div class="logo-container">
        <img src="{% static 'AppAdAtM/Imagenes/tu-logo-isotipo.png' %}" alt="Logo">
      </div>

      <div class="sublogo-container">
        <img  src="{% static 'AppAdAtM/Imagenes/tu-sublogo-texto.png' %}" alt="Biotechnica">
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="alert-msg {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form class="form-container" method="POST" action="">
        {% csrf_token %}

        <div class="form-grid">
          <div class="form-group">
            <label for="run">RUN</label>
            <input class="validar-run" type="text" id="run" name="run" placeholder="12.345.678-5"
              maxlength="12" autocomplete="off" required>
          </div>
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" maxlength="20" placeholder="Primer nombre" required>
          </div>

          <div class="form-group">
            <label for="segundo-nombre">Segundo Nombre</label>
            <input type="text" id="segundo-nombre" name="segundo-nombre" maxlength="20" placeholder="Opcional">
          </div>
          <div class="form-group">
            <label for="tercer-nombre">Tercer Nombre</label>
            <input type="text" id="tercer-nombre" name="tercer-nombre" maxlength="20" placeholder="Opcional">
          </div>

          <div class="form-group">
            <label for="apellido-paterno">Apellido Paterno</label>
            <input type="text" id="apellido-paterno" name="apellido-paterno" maxlength="20" placeholder="Apellido paterno" required>
          </div>
          <div class="form-group">
            <label for="apellido-materno">Apellido Materno</label>
            <input type="text" id="apellido-materno" name="apellido-materno" maxlength="20" placeholder="Apellido materno">
          </div>

          <div class="form-group">
            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" max="{{ fecha_maxima }}" required>
          </div>
          <div class="form-group">
            <label for="telefono">Numero Personal de Contacto</label>
            <div class="phone-input-group">
              <input type="text" class="phone-prefix" value="+56" readonly>
              <input class="solo-numeros" type="tel" id="telefono" name="telefono" inputmode="numeric"
                pattern="9[0-9]{8}" maxlength="9" placeholder="912345678" required>
            </div>
          </div>

          <div class="form-group">
            <label for="correo">Correo Personal de Contacto</label>
            <input type="email" id="correo" name="correo" maxlength="50" autocomplete="email"
              placeholder="ejemplo@correo.com" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña de Acceso</label>
            <input type="password" id="password" name="password" minlength="8"
              autocomplete="new-password" placeholder="Mínimo 8 caracteres; evita datos personales" required>
          </div>

          <div class="btn-submit-container">
            <button type="submit" class="btn-register">Registrarse</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
